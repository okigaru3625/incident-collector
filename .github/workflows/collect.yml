name: 学校インシデント情報収集

on:
  schedule:
    # 3時間おきに実行（UTC 0,3,6,...時 = JST 9,12,15,...時。GitHub側の混雑で遅れることがあります）
    - cron: '0 */3 * * *'
  workflow_dispatch:
    # 手動実行も可能

permissions:
  contents: write

# 同時に複数回動いて push がぶつからないようにする（月次レポートと共通）
concurrency:
  group: update-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: インシデント情報を収集
        run: python collect_incidents.py

      - name: 変更があればコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add incidents.json excluded.json 2>/dev/null || git add incidents.json
          if git diff --cached --quiet; then
            echo "記事内容に変化がないため、コミットしません"
            exit 0
          fi
          git commit -m "chore: インシデント情報を自動更新 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
